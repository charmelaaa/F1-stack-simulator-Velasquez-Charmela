
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stack Data Structure Simulator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>

<div class="container col-sm-10 col-md-8 mt-4">
    <h1 class="display-6 p-3 mb-3 text-center text-bg-dark">
        Stack Data Structure Simulator
    </h1>

    <div class="row text-bg-success p-3 mb-1 text-center">
        <div class="col">Operations</div>
        <div class="col">Stack Data</div>
        <div class="col">Deleted from Stack</div>
    </div>

    <div class="row bg-danger p-2">

        <div class="col-4 bg-7B8FA1 p-2">
            <input type="text" id="stackInput"
                class="form-control text-center mb-2"
                placeholder="Enter data">

            <div class="d-grid gap-2">
                <button id="pushBtn" class="btn btn-success">Push</button>
                <button id="popBtn" class="btn btn-danger">Pop</button>
                <button id="peekBtn" class="btn btn-warning">Peek</button>
                <button id="clearBtn" class="btn btn-light">Clear</button>
            </div>
        </div>

        <div id="stack" class="col-4 bg-dark stack-area">
        </div>

        <div class="col-4 popped bg-9C254D">
            <div id="deleted" class="deleted-area"></div>
        </div>

    </div>

    <p id="message" class="text-center mt-3 fw-bold text-white"></p>
</div>

<script src="https://code.jquery.com/jquery-3.6.3.min.js"></script>
<script src="stack.js"></script>

</body>
</html>
