
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Queue Data Structure Simulator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="style.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">

    <h1 class="display-6 p-3 mb-3 text-center text-bg-dark">
        Queue Data Structure Simulator
    </h1>

    <div class="row text-bg-success p-3 mb-1 text-center">
        <div class="col">Operations</div>
        <div class="col">Queue Data</div>
        <div class="col">Deleted from Queue</div>
    </div>

    <div class="row bg-danger p-2">

        <div class="col-12 col-md-4 bg-7B8FA1 p-2">

            <input
                type="text"
                id="queueInput"
                class="form-control text-center mb-2"
                placeholder="Enter data"
            >

            <div class="d-grid gap-2">
                <button id="enqueueBtn" class="btn btn-success">
                    Enqueue
                </button>

                <button id="dequeueBtn" class="btn btn-danger">
                    Dequeue
                </button>

                <button id="peekBtn" class="btn btn-warning">
                    Peek
                </button>

                <button id="clearBtn" class="btn btn-light">
                    Clear
                </button>
            </div>
        </div>

        <div class="col-12 col-md-4 bg-dark queue-area">
            <div id="frontLabel" class="text-warning text-center">
                FRONT
            </div>

            <div id="queue"></div>

            <div id="rearLabel" class="text-info text-center">
                REAR
            </div>
        </div>

        <div class="col-12 col-md-4 popped bg-9C254D">
            <div class="text-white text-center mb-2">
                Deleted Items
            </div>

            <div id="deleted" class="deleted-area"></div>
        </div>

    </div>

    <p id="message" class="text-center mt-3 fw-bold text-white"></p>

</div>

<script src="https://code.jquery.com/jquery-3.6.3.min.js"></script>
<script src="queue.js"></script>

</body>
</html>
